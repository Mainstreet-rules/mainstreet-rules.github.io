<title>Mainstreet RP Rulebook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128658;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style id="rb-style">
  :root{
    --ink:#050706;
    --panel:#0b100d;
    --panel-2:#0f1712;
    --raise:#131c16;
    --line:#1d2a22;
    --line-soft:#141d18;
    --text:#e3ece5;
    --text-dim:#c3d3c8;
    --muted:#8ba295;

    --rs:1;              /* reading scale, set by the Aa button */
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    --green:#3ddc77;
    --green-deep:#1f8b4c;
    --green-wash:rgba(61,220,119,.10);
    --amber:#e3b341;
    --red:#e5534b;

    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;

    --nav-w:288px;
    --pad:clamp(20px,4vw,56px);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  img,svg{display:block;max-width:100%}

  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--green);text-decoration:none}
  a:hover{text-decoration:underline}

  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:2px}
  ::selection{background:rgba(61,220,119,.28);color:#fff}

  /* ---------- shell ---------- */

  .shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}

  /* ---------- sidebar ---------- */

  .nav{
    position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow:hidden;
  }

  .brand{
    display:flex;align-items:center;gap:12px;
    width:100%;padding:22px 20px 18px;
    border:0;border-bottom:1px solid var(--line-soft);
    background:none;color:inherit;font:inherit;cursor:pointer;
  }
  .brand:hover .brand-name{color:var(--green)}

  .sigil{
    width:34px;height:34px;flex:none;display:grid;place-items:center;
    border:1px solid var(--green-deep);
    background:linear-gradient(160deg,rgba(61,220,119,.18),transparent 70%);
    color:var(--green);
  }

  .brand-txt{text-align:left}
  .brand-name{
    display:block;font-family:var(--cond);font-weight:700;font-size:19px;
    letter-spacing:.02em;line-height:1.1;text-transform:uppercase;
    transition:color .12s ease;
  }
  .brand-sub{
    display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-top:3px;
  }

  .nav-scroll{
    flex:1;overflow-y:auto;padding:14px 12px 20px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }

  .nav-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);padding:8px 10px 10px;
  }

  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:9px 10px;border:0;border-left:2px solid transparent;
    background:none;color:var(--text-dim);font:inherit;font-size:14.5px;
    text-align:left;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .nav-item:hover{background:var(--panel-2);color:var(--text)}
  .nav-item[aria-current="page"]{
    background:var(--green-wash);border-left-color:var(--green);
    color:#fff;font-weight:500;
  }
  .nav-item .ico{flex:none;color:var(--green);opacity:.85}
  .nav-item[aria-current="page"] .ico{opacity:1}
  .nav-item .n{flex:1;min-width:0}

  .nav-sub{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:7px 12px 7px 24px;
    border:0;border-left:2px solid var(--line-soft);
    background:none;color:var(--muted);font:inherit;font-size:13.5px;
    text-align:left;cursor:pointer;line-height:1.4;
  }
  .nav-sub:hover{color:var(--text);background:var(--panel-2);border-left-color:var(--green-deep)}

  .tick{
    width:15px;height:15px;flex:none;border:1px solid var(--line);
    display:grid;place-items:center;color:transparent;font-size:10px;
  }
  .tick.on{border-color:var(--green-deep);background:var(--green-wash);color:var(--green)}

  .nav-foot{
    border-top:1px solid var(--line-soft);padding:14px 20px 18px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);
    display:flex;flex-direction:column;gap:8px;
  }
  .meter{height:3px;background:var(--line-soft);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--green);width:0;transition:width .35s ease}

  /* ---------- top bar ---------- */

  .main{min-width:0;display:flex;flex-direction:column}

  .bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;
    padding:12px var(--pad);
    background:rgba(5,7,6,.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }

  .burger{
    display:none;width:38px;height:38px;flex:none;
    border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
  }

  .search{position:relative;flex:1;max-width:520px}
  .search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search input{
    width:100%;padding:10px 74px 10px 38px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:14.5px;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--green-deep);outline:none}
  .kbd{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
    border:1px solid var(--line);padding:2px 6px;pointer-events:none;
  }

  .bar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .bar-stat{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;
  }
  .bar-stat b{color:var(--green);font-weight:500}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;
    transition:border-color .14s ease,background .14s ease,color .14s ease;
  }
  .btn:hover{border-color:var(--green-deep);background:var(--panel-2)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#04140a;font-weight:600}
  .btn.primary:hover{background:#4ff089;border-color:#4ff089}
  .btn.ghost{background:none}
  .btn.danger:hover{border-color:rgba(229,83,75,.6);color:var(--red)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.hide{display:none}

  .size-btn{padding:7px 12px;line-height:1;font-family:var(--cond);letter-spacing:.02em}
  .size-btn span{font-size:.82em}
  body.rs-2{--rs:1.13}
  body.rs-3{--rs:1.28}
  body.rs-2 .size-btn span,body.rs-3 .size-btn span{font-size:1em}
  body.rs-3 .size-btn{font-size:16px}

  /* ---------- page ---------- */

  .page{padding:0 var(--pad) 96px;flex:1}
  .wrap{max-width:min(70ch,100%);margin:0 auto}
  .wrap.wide{max-width:min(98ch,100%)}

  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--green);display:flex;align-items:center;gap:10px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

  h1{
    font-family:var(--cond);font-weight:700;
    font-size:clamp(34px,5.4vw,54px);line-height:1.02;letter-spacing:-.01em;
    text-transform:uppercase;text-wrap:balance;margin:16px 0 0;
  }
  h2{
    font-family:var(--cond);font-weight:600;font-size:22px;letter-spacing:.04em;
    text-transform:uppercase;text-wrap:balance;margin:0;color:#fff;
  }
  .lede{font-size:calc(18.5px * var(--rs));color:var(--text-dim);margin:18px 0 0;max-width:60ch;line-height:1.6}

  /* ---------- home ---------- */

  .hero{padding:clamp(44px,7vw,84px) 0 40px}
  .stamp{
    display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);
    padding:6px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:26px;
  }
  .stamp .dot{width:6px;height:6px;background:var(--green);border-radius:50%}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px;margin-top:38px}
  .card{
    display:flex;align-items:flex-start;gap:14px;width:100%;padding:20px;
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--green-deep);
    color:inherit;font:inherit;text-align:left;cursor:pointer;
    transition:background .14s ease,border-color .14s ease,transform .14s ease;
  }
  .card:hover{background:var(--panel-2);border-left-color:var(--green);transform:translateY(-1px)}
  .card .ico{flex:none;color:var(--green);margin-top:2px}
  .card h3{
    font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.03em;
    text-transform:uppercase;margin:0 0 5px;color:#fff;
  }
  .card p{margin:0;font-size:15px;color:var(--text-dim);line-height:1.6}
  .card .count{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--green);display:block;margin-top:10px}

  .quick{margin-top:56px;border:1px solid var(--line);background:var(--panel);padding:24px}
  .quick h2{font-size:18px;margin-bottom:6px}
  .quick .sub{font-size:13.5px;color:var(--muted);margin:0 0 18px}
  .quick ol{margin:0;padding-left:22px;display:grid;gap:13px;color:var(--text-dim);font-size:calc(16px * var(--rs));line-height:1.65}
  .quick ol b{color:var(--text);font-weight:500}

  .legend{
    margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding-top:18px;border-top:1px solid var(--line-soft);
  }
  .legend .txt{font-size:13.5px;color:var(--muted);margin-right:12px}

  /* ---------- section page ---------- */

  .sec-head{padding:clamp(36px,6vw,64px) 0 30px;border-bottom:1px solid var(--line)}
  .group{padding-top:56px;scroll-margin-top:78px}
  .group-head{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:6px;border-bottom:1px solid var(--line-soft);
  }
  .group-head .gid{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}

  /* emoji glyphs */
  .ico{font-family:var(--emoji);font-size:16px;line-height:1;font-style:normal}
  .ico.sm{font-size:13.5px}
  .ico.big{font-size:26px}
  .ico.h1{font-size:.78em;margin-right:.32em;vertical-align:.04em}
  .ico.h2{font-size:1em;margin-right:.45em}
  .card .ico.big{margin-top:0}

  .rule{padding:30px 0;border-bottom:1px solid var(--line-soft);scroll-margin-top:86px}
  .rule:target{
    background:linear-gradient(90deg,var(--green-wash),transparent 70%);
    box-shadow:-14px 0 0 0 var(--green-wash),-16px 0 0 0 var(--green);
  }
  .rule-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rid{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;
    color:var(--green);border:1px solid var(--green-deep);padding:2px 7px;flex:none;
  }
  .rule h4{
    font-family:var(--sans);font-weight:600;font-size:calc(18.5px * var(--rs));line-height:1.35;margin:0;
    color:#fff;flex:1;min-width:200px;text-wrap:balance;
  }
  .rule .body{margin:14px 0 0;color:var(--text-dim);font-size:calc(16.5px * var(--rs));line-height:1.72}
  .rule .body p{margin:0 0 15px}
  .rule .body p:last-child{margin-bottom:0}
  .rule .body ul{margin:0 0 15px;padding-left:22px;display:grid;gap:10px}
  .rule .body ul:last-child{margin-bottom:0}
  .rule .body strong{color:var(--text);font-weight:600}
  .rule .body em{color:var(--text)}
  .rule .body code{
    font-family:var(--mono);font-size:13.5px;color:var(--green);
    background:var(--raise);padding:1px 5px;border:1px solid var(--line);
  }

  .flag{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:3px 8px;border:1px solid;white-space:nowrap;
  }
  .flag{display:inline-flex;align-items:center;gap:5px}
  .flag .ico{font-size:11px}
  .tone-green{color:var(--green);border-color:var(--green-deep);background:var(--green-wash)}
  .tone-amber{color:var(--amber);border-color:rgba(227,179,65,.45);background:rgba(227,179,65,.07)}
  .tone-red{color:var(--red);border-color:rgba(229,83,75,.5);background:rgba(229,83,75,.08)}
  .tone-grey{color:var(--text-dim);border-color:var(--line);background:var(--raise)}
  .tone-none{color:var(--muted);border-color:var(--line);background:none}

  /* marker picker inside the rule form */
  .picks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pick{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 11px;border:1px solid;cursor:pointer;background:none;opacity:.55;
    transition:opacity .12s ease,box-shadow .12s ease;
  }
  .pick:hover{opacity:1}
  .pick.on{opacity:1;box-shadow:inset 0 0 0 1px currentColor}

  /* marker manager */
  .mk-row{gap:10px}
  .tones{display:flex;gap:6px;flex:none}
  .tone-dot{
    width:20px;height:20px;border:1px solid;cursor:pointer;padding:0;
    opacity:.45;transition:opacity .12s ease;
  }
  .tone-dot:hover{opacity:.85}
  .tone-dot.on{opacity:1;box-shadow:inset 0 0 0 2px var(--panel)}
  .mk-use{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;align-self:center}

  .link-btn{
    flex:none;width:28px;height:28px;display:grid;place-items:center;
    border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;
    opacity:0;transition:opacity .12s ease,color .12s ease;
  }
  .rule:hover .link-btn,.link-btn:focus-visible{opacity:1}
  .link-btn:hover{color:var(--green);border-color:var(--line)}
  .link-btn.done{opacity:1;color:var(--green)}

  /* ---------- footer nav ---------- */

  .sec-foot{margin-top:56px;display:flex;flex-direction:column;gap:22px}
  .ack{
    display:flex;align-items:center;gap:13px;padding:16px 18px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text-dim);font:inherit;font-size:14.5px;cursor:pointer;text-align:left;
    transition:border-color .14s ease,background .14s ease;
  }
  .ack:hover{border-color:var(--green-deep);background:var(--panel-2)}
  .ack .box{width:20px;height:20px;flex:none;border:1px solid var(--line);display:grid;place-items:center;color:transparent}
  .ack.on{color:var(--text)}
  .ack.on .box{border-color:var(--green);background:var(--green);color:var(--ink)}

  .pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pager button{
    display:flex;flex-direction:column;gap:4px;padding:16px 18px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font:inherit;cursor:pointer;transition:border-color .14s ease,background .14s ease;
  }
  .pager button:hover{border-color:var(--green-deep);background:var(--panel-2)}
  .pager .dir{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .pager .ttl{font-family:var(--cond);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
  .pager .next{text-align:right;align-items:flex-end}

  /* ---------- search ---------- */

  .results-head{padding:36px 0 8px}
  .hit{
    display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--line-soft);padding:20px 0;
    color:inherit;font:inherit;cursor:pointer;
  }
  .hit:hover .h-title{color:var(--green)}
  .h-crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .h-title{font-weight:600;font-size:16.5px;color:#fff;margin-bottom:6px}
  .h-snip{font-size:calc(15.5px * var(--rs));line-height:1.6;color:var(--text-dim)}
  mark{background:rgba(61,220,119,.22);color:#fff;padding:0 2px}

  /* ---------- changelog ---------- */

  .log{padding-top:34px;display:grid}
  .log-entry{display:grid;grid-template-columns:132px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line-soft)}
  .log-date{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--green);padding-top:2px}
  .log-date small{display:block;color:var(--muted);letter-spacing:.14em;font-size:10px;text-transform:uppercase;margin-top:5px}
  .log-entry h4{margin:0 0 12px;font-size:17.5px;font-weight:600;color:#fff}
  .log-entry ul{margin:0 0 14px;padding-left:20px;display:grid;gap:11px;color:var(--text-dim);font-size:calc(16px * var(--rs));line-height:1.65}
  .log-entry ul:last-child{margin-bottom:0}
  .diff{display:grid;gap:1px;margin:0 0 14px;border:1px solid var(--line);background:var(--line)}
  .diff > div{background:var(--panel);padding:15px 17px;font-size:calc(15.5px * var(--rs));line-height:1.62;color:var(--text-dim)}
  .diff .lbl{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    display:block;margin-bottom:6px;
  }
  .diff .was{color:var(--muted)}
  .diff .was .lbl{color:var(--muted)}
  .diff .now .lbl{color:var(--green)}

  .scrim{display:none}

  /* ---------- editor ---------- */

  .editbar{
    position:sticky;top:var(--barH,63px);z-index:19;
    display:none;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px var(--pad);
    background:var(--panel-2);
    border-bottom:1px solid var(--green-deep);
  }
  body.editing .editbar{display:flex}

  .editbar .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--green);border:1px solid var(--green-deep);padding:3px 9px;
  }
  .editbar .note{font-size:13.5px;color:var(--muted)}
  .editbar .grow{margin-left:auto;display:flex;align-items:center;gap:10px}
  .dot-dirty{
    width:7px;height:7px;border-radius:50%;background:var(--amber);
    display:none;
  }
  body.dirty .dot-dirty{display:block}

  .ed-only{display:none}
  body.editing .ed-only{display:inline-flex}
  body.editing .rule:hover{background:rgba(61,220,119,.03)}

  .rule-tools{display:none;gap:4px;flex:none}
  body.editing .rule-tools{display:flex}
  .icon-btn{
    width:28px;height:28px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    cursor:pointer;font:inherit;font-size:12px;line-height:1;
  }
  .icon-btn:hover{color:var(--green);border-color:var(--green-deep)}
  .icon-btn.del:hover{color:var(--red);border-color:rgba(229,83,75,.5)}

  .form{display:grid;gap:12px;margin-top:14px;padding:16px;background:var(--panel);border:1px solid var(--green-deep)}
  .form label{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .form input[type=text],.form textarea,.form select{
    width:100%;padding:9px 11px;background:var(--ink);border:1px solid var(--line);
    color:var(--text);font:inherit;font-size:15px;
  }
  .form textarea{min-height:150px;font-family:var(--mono);font-size:13.5px;line-height:1.6;resize:vertical}
  .form input:focus,.form textarea:focus,.form select:focus{border-color:var(--green-deep);outline:none}
  .form .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .form .row > *{flex:1;min-width:160px}
  .form .actions{display:flex;gap:10px;justify-content:flex-end}
  .form .hint{font-size:12.5px;color:var(--muted);margin:0}

  .ed-input{

<script>
/* ===========================================================================
   MAINSTREET RP — RULEBOOK

   Content lives in the #book-data JSON block above, and is edited in the page
   itself: anyone with edit access to this artifact sees an "Edit rulebook"
   button, and publishing writes a new version of this page that every open
   view reloads to.

   Severity (`f`) matches the GitBook markers:  ok = ✅  warn = 🟡  no = ❌
=========================================================================== */

const SELF_SCRIPT = document.currentScript;
const ENGINE_SRC  = SELF_SCRIPT.textContent;
const STYLE_SRC   = document.getElementById('rb-style').textContent;
const SHELL_SRC   = document.querySelector('.shell').outerHTML
                  + '\n' + document.getElementById('scrim').outerHTML
                  + '\n' + document.getElementById('toast').outerHTML
                  + '\n' + document.getElementById('sheet').outerHTML;
/* Kept in step with the <head> above, so a republish from inside the page
   does not lose the favicon or the fonts. */
const FONT_SRC =
  '<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128658;</text></svg>">\n' +
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
  '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
  '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">';

/* The data block holds {book, backups}. Older versions held the book array on
   its own, so both shapes are accepted. Backups are snapshots of the book as
   it was BEFORE each publish — they never contain backups of their own. */
const MAX_BACKUPS = 5;
const DATA    = JSON.parse(document.getElementById('book-data').textContent);
const BOOK    = Array.isArray(DATA) ? DATA : (DATA.book || []);
let   BACKUPS = (Array.isArray(DATA) ? [] : (DATA.backups || [])).slice(0, MAX_BACKUPS);
const clone   = x => JSON.parse(JSON.stringify(x));
let   ORIGINAL = clone(BOOK);   /* the published state this view loaded */

/* Admin records. EDITORS is a roster the owner keeps — it does NOT grant
   anything; artifact sharing does. AUDIT is the change history, written on
   every successful publish. */
const MAX_AUDIT = 200;
let EDITORS = (!Array.isArray(DATA) && Array.isArray(DATA.editors)) ? DATA.editors : [];
let AUDIT   = (!Array.isArray(DATA) && Array.isArray(DATA.audit))   ? DATA.audit   : [];

/* Markers are data: rename them, recolour them, add your own. A rule's `f`
   holds a marker id. Older data has no markers list, so seed the three the
   book started with. */
const DEFAULT_MARKERS = [
  {id:'ok',   label:'Expected',   emoji:'✅', tone:'green'},
  {id:'warn', label:'Warning',    emoji:'🟡', tone:'amber'},
  {id:'no',   label:'Prohibited', emoji:'❌', tone:'red'}
];
const TONES = ['green','amber','red','grey'];

let MARKERS = (!Array.isArray(DATA) && Array.isArray(DATA.markers) && DATA.markers.length)
  ? DATA.markers : clone(DEFAULT_MARKERS);

let ORIGINAL_MARKERS = clone(MARKERS);
let ORIGINAL_EDITORS = clone(EDITORS);
const markerById = id => MARKERS.find(m => m.id === id);

/* a marker as it appears beside a rule, or in the legend */
function markerChip(m){
  if(!m) return '';
  return '<span class="flag tone-'+esc(m.tone||'grey')+'">'
       + (m.emoji ? '<span class="ico sm">'+esc(m.emoji)+'</span> ' : '')
       + esc(m.label) + '</span>';
}

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const page = $('#page'), navScroll = $('#navScroll'), qInput = $('#q');

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const glyph = (e,cls) => '<span class="ico '+(cls||'')+'" aria-hidden="true">'+esc(e||'📘')+'</span>';

/* a page can hold rules from more than one ID series after a reshuffle */
const prefixesOf = g =>
  [...new Set(g.rules.map(r=>String(r.id).split('-')[0]))].join(', ') || g.prefix;

const sections   = () => BOOK.filter(s=>s.groups);
const ruleCount  = s => (s.groups||[]).reduce((n,g)=>n+g.rules.length,0);
const totalRules = () => BOOK.reduce((n,s)=>n+ruleCount(s),0);
const logSection = () => BOOK.find(s=>s.changelog);
const lastUpdated = () => { const l = logSection(); return l && l.changelog[0] ? l.changelog[0].date : ''; };

function refreshStats(){
  $('#ruleCount').textContent = totalRules();
  $('#barDate').textContent = 'upd. ' + lastUpdated();
}

function buildIndex(){
  const idx = [];
  BOOK.forEach(sec=>(sec.groups||[]).forEach(gr=>gr.rules.forEach(r=>{
    idx.push({sec,gr,r,text:(r.id+' '+r.t+' '+String(r.b).replace(/<[^>]+>/g,' ')).replace(/\s+/g,' ')});
  })));
  return idx;
}
let INDEX = buildIndex();

/* ---------------- per-viewer reading progress ---------------- */

const KEY = 'msrp-rulebook-read-v1';
let readSet = new Set();
try{ readSet = new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){}
const saveRead = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify([...readSet])); }catch(e){} };

/* ---------------- text size ---------------- */

const SIZE_KEY = 'msrp-rulebook-textsize-v1';
let textSize = 1;
const SIZE_NAME = {1:'Normal', 2:'Large', 3:'Largest'};

function setTextSize(n, quiet){
  textSize = (n===2 || n===3) ? n : 1;
  document.body.classList.remove('rs-2','rs-3');
  if(textSize > 1) document.body.classList.add('rs-'+textSize);
  try{ localStorage.setItem(SIZE_KEY, String(textSize)); }catch(e){}
  if(!quiet) toast('Text size: ' + SIZE_NAME[textSize]);
}

function renderMeter(){
  const list = BOOK, done = list.filter(s=>readSet.has(s.id)).length;
  $('#meterFill').style.width = (done/list.length*100)+'%';
  $('#meterText').textContent = done + ' of ' + list.length + ' sections read';
}

/* ---------------- sidebar ---------------- */

function renderNav(activeId){
  navScroll.innerHTML = '<div class="nav-label">Sections</div>' + BOOK.map(sec=>{
    const cur = sec.id===activeId ? ' aria-current="page"' : '';
    const subs = (sec.id===activeId && sec.groups)
      ? sec.groups.map(g=>'<button class="nav-sub" data-goto="'+sec.id+'" data-group="'+g.id+'">'
          + glyph(g.emoji,'sm') + '<span>'+esc(g.name)+'</span></button>').join('')
      : '';
    return '<button class="nav-item" data-goto="'+sec.id+'"'+cur+'>'
      + glyph(sec.emoji)
      + '<span class="n">'+esc(sec.name)+'</span>'
      + '<span class="tick '+(readSet.has(sec.id)?'on':'')+'" aria-hidden="true">✓</span>'
      + '</button>' + subs;
  }).join('');
  renderMeter();
}

/* ---------------- views ---------------- */

function viewHome(){
  return '<div class="wrap wide"><header class="hero">'
    + '<div class="stamp"><span class="dot"></span> Last updated '+esc(lastUpdated())+' · '+totalRules()+' rules</div>'
    + '<div class="eyebrow">Mainstreet RP</div>'
    + '<h1>The Rulebook</h1>'
    + '<p class="lede">Everything you agree to by spawning into the city. Read it through once, then search it whenever a scene goes sideways. Every rule has an ID — if staff tell you that you broke <strong>CMB-02</strong>, this is where you find out what that means.</p>'
    + '<div class="cards">' + BOOK.map(sec=>
        '<button class="card" data-goto="'+sec.id+'">' + glyph(sec.emoji,'big')
        + '<span style="flex:1"><h3>'+esc(sec.name)+'</h3><p>'+esc(sec.blurb)+'</p>'
        + '<span class="count">'+(sec.groups ? ruleCount(sec)+' RULES · '+sec.groups.length+' PAGES' : 'CHANGELOG')+'</span></span></button>'
      ).join('') + '</div>'
    + '<section class="quick"><h2>If you read nothing else</h2>'
    + '<p class="sub">The rules that come up in almost every report.</p><ol>'
    + '<li><b>Stay in character.</b> From spawn to logout. Never go OOC to argue, explain yourself, or get out of what is happening to your character.</li>'
    + '<li><b>30-second interaction.</b> Out of the car, a real conversation, a valid RP reason — before anyone shoots.</li>'
    + '<li><b>Value your life.</b> Outnumbered and outgunned means your character acts like it.</li>'
    + '<li><b>New Life Rule.</b> You forget how you died and stay away from the scene for 15 minutes.</li>'
    + '<li><b>No metagaming.</b> Discord, streams and out-of-city calls don\'t exist to your character.</li>'
    + '<li><b>Never log out mid-scene.</b> Wait until the situation has fully concluded.</li>'
    + '<li><b>Three warnings on a compound.</b> Someone must be warned to leave three times before they can be shot — and that is void the moment they are actually leaving. It works both ways.</li>'
    + '<li><b>KOS and NCO are never self-issued.</b> Both need Illegal Team documentation and management approval.</li>'
    + '</ol><div class="legend"><span class="txt">Markers used through the book:</span>'
    + MARKERS.map(markerChip).join('')
    + '</div></section></header></div>';
}

function ruleHTML(sec,gr,r,i,n){
  const flag = r.f ? markerChip(markerById(r.f)) : '';
  const tools = !mayEdit(sec.id) ? '' : '<span class="rule-tools">'
    + '<button class="icon-btn" data-redit="'+r.id+'" title="Edit this rule" aria-label="Edit rule '+esc(r.id)+'">✎</button>'
    + '<button class="icon-btn" data-rmove="'+r.id+'" data-dir="-1" title="Move up" aria-label="Move rule up"'+(i===0?' disabled':'')+'>↑</button>'
    + '<button class="icon-btn" data-rmove="'+r.id+'" data-dir="1" title="Move down" aria-label="Move rule down"'+(i===n-1?' disabled':'')+'>↓</button>'
    + (isOwner()
        ? '<button class="icon-btn del" data-rdel="'+r.id+'" title="Delete this rule" aria-label="Delete rule">✕</button>'
        : '<button class="icon-btn" disabled title="Only the owner can remove rules">✕</button>')
    + '</span>';

  const form = (openRule===r.id) ? ruleFormHTML(r) : '<div class="body">'+r.b+'</div>';

  return '<article class="rule" id="'+sec.id+'/'+r.id+'" data-rule="'+r.id+'" data-group="'+gr.id+'">'
    + '<div class="rule-head"><span class="rid">'+esc(r.id)+'</span><h4>'+esc(r.t)+'</h4>'+flag

function viewSearch(query){
  const q = query.toLowerCase();
  const hits = INDEX.filter(e=>e.text.toLowerCase().includes(q));
  if(!hits.length){
    return '<div class="wrap"><div class="results-head"><div class="eyebrow">Search</div><h1>No matches</h1>'
      + '<p class="lede">Nothing in the book mentions “'+esc(query)+'”. Try a shorter word, or a rule ID like CMB-02.</p></div></div>';
  }
  return '<div class="wrap"><div class="results-head"><div class="eyebrow">Search</div><h1>'
    + hits.length + ' result' + (hits.length>1?'s':'') + '</h1></div>'
    + hits.map(e=>{
        const plain = e.text.replace(e.r.id,'').replace(e.r.t,'').trim();
        const at = plain.toLowerCase().indexOf(q);
        const from = Math.max(0, at-70);
        const snip = (from>0?'…':'') + plain.slice(from, from+200) + (plain.length>from+200?'…':'');
        return '<button class="hit" data-goto="'+e.sec.id+'" data-rule="'+e.r.id+'">'
          + '<div class="h-crumb">'+esc(e.sec.emoji||'')+' '+esc(e.sec.name)+' · '+esc(e.gr.name)+' · '+esc(e.r.id)+'</div>'
          + '<div class="h-title">'+esc(e.r.t)+'</div><div class="h-snip">'+esc(snip)+'</div></button>';
      }).join('') + '</div>';
}

function highlight(root, query){
  const q = query.toLowerCase();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const targets = [];
  while(walker.nextNode()){
    const n = walker.currentNode;
    if(n.parentElement.closest('mark')) continue;
    if(n.nodeValue.toLowerCase().includes(q)) targets.push(n);
  }
  targets.forEach(n=>{
    const frag = document.createDocumentFragment();
    let s = n.nodeValue, i;
    while((i = s.toLowerCase().indexOf(q)) !== -1){
      frag.appendChild(document.createTextNode(s.slice(0,i)));
      const m = document.createElement('mark');
      m.textContent = s.slice(i,i+q.length);
      frag.appendChild(m);
      s = s.slice(i+q.length);
    }
    frag.appendChild(document.createTextNode(s));
    n.parentNode.replaceChild(frag,n);
  });
}

function readUrl(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  const parts = h.split('/');
  route = {sec: BOOK.some(x=>x.id===parts[0]) ? parts[0] : null, rule: parts[1]||null, group:null, admin: parts[0]==="admin"};

function render(){
  const q = qInput.value.trim();
  if(q.length >= 2 && !editing){
    page.innerHTML = viewSearch(q);
    highlight(page,q);
    renderNav(null);
    return;
  }

  if(route.admin){
    page.innerHTML = viewAdmin();
    renderNav(null);
    if(!route.keepScroll) window.scrollTo(0,0);
    route.keepScroll = false;
    return;
  }

  const sec = BOOK.find(s=>s.id===route.sec);
  if(!sec){
    page.innerHTML = viewHome();
    renderNav(null);
    window.scrollTo(0,0);

  page.innerHTML = viewSection(sec);

  const target = route.rule  ? document.getElementById(sec.id+'/'+route.rule)
               : route.group ? document.getElementById('g-'+sec.id+'-'+route.group)

let cap = null;            /* the artifact capability, once it resolves */

const DRAFT = 'msrp-rulebook-draft-v1';
const RO_KEY = 'msrp-rulebook-readonly-v1';

/* Who may edit is decided by the artifact's own sharing, and enforced when
   publishing — the page cannot ask who is looking. So the button shows until
   a publish is refused, after which we keep it out of this viewer's way for a
   week (not forever: the owner may grant them access later). */
function rememberReadOnly(){
  try{ localStorage.setItem(RO_KEY, String(Date.now())); }catch(e){}
}
function wasRefusedRecently(){
  try{
    const t = Number(localStorage.getItem(RO_KEY) || 0);
    return t > 0 && (Date.now() - t) < 7*24*60*60*1000;
  }catch(e){ return false; }
}

function markDirty(){
  dirty = true;
  document.body.classList.add('dirty');
}

function toast(msg, kind){
  const t = $('#toast');
  $('#toastMsg').textContent = msg;
  $('#toastIco').textContent = kind==='bad' ? '!' : (kind==='good' ? '✓' : '•');
  t.className = 'toast show' + (kind ? ' '+kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast'; }, kind==='bad' ? 9000 : 4500);
}

function findRule(id){
  for(const sec of BOOK){
    for(const g of (sec.groups||[])){
      const i = g.rules.findIndex(r=>r.id===id);
      if(i>-1) return {sec, g, r:g.rules[i], i};
    }
  }
  return null;
}

function nextId(prefix){
  let max = 0;
  BOOK.forEach(s=>(s.groups||[]).forEach(g=>g.rules.forEach(r=>{
    const m = String(r.id).match(/^(.+)-(\d+)$/);
    if(m && m[1]===prefix) max = Math.max(max, parseInt(m[2],10));
  })));
  return prefix + '-' + String(max+1).padStart(2,'0');
}

function currentSection(){ return BOOK.find(s=>s.id===route.sec); }

/* Rule text is edited as plain text — blank lines are paragraphs, "- " lines
   are bullets — and stored as HTML. Inline <strong> <em> <code> survive the
   round trip in both directions. */

const INLINE_OK = /&lt;(\/?)(strong|em|b|i|code|br\s*\/?)&gt;/gi;

function htmlToText(html){
  return String(html)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/li>/gi, '\n')
    .replace(/<li>/gi, '- ')
    .replace(/<\/?(ul|ol)>/gi, '\n\n')
    .replace(/<\/?(p|div)>/gi, '\n\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function textToHtml(text){
  const line = l => l
    .replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(INLINE_OK, '<$1$2>');
  return String(text).trim().split(/\n{2,}/).map(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return '';
    if(lines.every(l=>/^[-*]\s+/.test(l)))
      return '<ul>' + lines.map(l=>'<li>'+line(l.replace(/^[-*]\s+/,''))+'</li>').join('') + '</ul>';
    return '<p>' + lines.map(line).join('<br>') + '</p>';
  }).join('');
}

/* plain text in, tidy HTML out — and never let markup that runs script through */
function normalizeBody(text){
  let s = String(text).trim();
  s = /<(p|ul|ol|li|div|h[1-6]|blockquote|table)\b/i.test(s) ? s : textToHtml(s);
  return s.replace(/<\s*\/?\s*(script|iframe|object|embed|style|link|meta)\b[^>]*>/gi,'')
          .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
          .replace(/javascript:/gi,'');
}

function renderWhoAmI(){
  const sel = $('#whoAmI');
  if(!sel) return;
  const who = identityName();
  sel.innerHTML = '<option value="__owner__">Owner (full rights)</option>'
    + EDITORS.filter(e=>e.name).map(e=>

        + esc(e.name) + (e.role ? ' · '+esc(e.role) : '') + '</option>').join('');

  editing = on;
  openRule = null;
  document.body.classList.toggle('editing', on);
  renderWhoAmI();
  syncBarHeight();

  else render();
}

/* --- the page rebuilds itself from its own source, then publishes it --- */
function buildDoc(){
  const json = JSON.stringify({book:BOOK, markers:MARKERS, editors:EDITORS, audit:AUDIT, backups:BACKUPS}, null, 1).split('<').join('\\u003c');
  const S = '<' + 'script', E = '<' + '/script' + '>';
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>Mainstreet RP Rulebook</title>\n'
    + FONT_SRC + '\n<style id="rb-style">' + STYLE_SRC + '</style>\n</head>\n<body>\n'
    + SHELL_SRC + '\n'
    + S + ' type="application/json" id="book-data">' + json + E + '\n'
    + S + '>' + ENGINE_SRC + E + '\n</body>\n</html>';
}

const ARCHIVE_KEY = 'msrp-rulebook-archived';
function lastArchive(){
  try{ return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || 'null'); }catch(e){ return null; }
}

/* ---------------- who is editing, and what they may touch ----------------
   The roster decides what the interface offers. It keeps people in their own
   sections and keeps deletion with the owner; it is not a security boundary,
   because anyone with artifact edit access can publish regardless. The audit
   log is what makes it stick. */

const ID_KEY = 'msrp-rulebook-identity';

/* Held in memory first, so the choice survives a browser that refuses
   storage (a private window, blocked site data) for the whole session. */
let IDENTITY = null;

function identityName(){
  if(IDENTITY === null){
    try{ IDENTITY = localStorage.getItem(ID_KEY) || ''; }catch(e){ IDENTITY = ''; }
  }
  return IDENTITY;
}
function setIdentity(name){
  IDENTITY = name || '';
  try{ localStorage.setItem(ID_KEY, IDENTITY); }catch(e){}
}

/* No roster, or nobody chosen yet, means full rights — a book with no
   permissions set behaves exactly as it did before. */
function identity(){
  const who = identityName();
  if(who && who !== '__owner__'){
    const e = EDITORS.find(x => (x.name||'') === who);
    if(e) return {name:e.name, level:e.level || 'editor', sections:e.sections || []};
  }
  return {name:'Owner', level:'owner', sections:['*']};
}

const isOwner = () => identity().level === 'owner';

function mayEdit(secId){
  const me = identity();
  if(me.level === 'owner') return true;
  const s = me.sections || [];
  return s.indexOf('*') > -1 || s.indexOf(secId) > -1;
}

const NAME_KEY = 'msrp-rulebook-editor-name';
function editorName(){ try{ return localStorage.getItem(NAME_KEY) || ''; }catch(e){ return ''; } }
function setEditorName(v){ try{ localStorage.setItem(NAME_KEY, v || ''); }catch(e){} }

async function publishNow(note, by){
  if(note){
    const log = logSection();
    if(log){
      const today = new Date();
      const stamp = String(today.getMonth()+1).padStart(2,'0') + '/'
                  + String(today.getDate()).padStart(2,'0') + '/' + today.getFullYear();
      const first = log.changelog[0];
      if(first && first.date === stamp){
        first.adds = (first.adds||[]).concat([esc(note)]);
      }else{
        log.changelog.unshift({date:stamp, title:'Rulebook updated', adds:[esc(note)]});
      }
    }
  }

  if(by) setEditorName(by);

  /* what this publish actually changes, recorded before it goes out */
  AUDIT.unshift({
    at: new Date().toISOString(),
    by: (by || editorName() || '').trim(),
    note: note || '',
    changes: diffBooks(ORIGINAL, BOOK, ORIGINAL_MARKERS, MARKERS)
              .concat(diffEditors(ORIGINAL_EDITORS, EDITORS))
  });
  AUDIT = AUDIT.slice(0, MAX_AUDIT);

  /* keep the version being replaced, so it can be rolled back from the page */
  BACKUPS.unshift({
    at: new Date().toISOString(),
    note: note || '',
    rules: ORIGINAL.reduce((n,s)=>n+(s.groups||[]).reduce((m,g)=>m+g.rules.length,0),0),
    book: ORIGINAL
  });
  BACKUPS = BACKUPS.slice(0, MAX_BACKUPS);

  const html = buildDoc();
  try{ sessionStorage.setItem(DRAFT, JSON.stringify(BOOK)); }catch(e){}

  $('#publishBtn').disabled = true;
  toast('Publishing…');

  try{
    await cap.publish(html);
    try{ sessionStorage.removeItem(DRAFT); }catch(e){}
    ORIGINAL = clone(BOOK);
    ORIGINAL_MARKERS = clone(MARKERS);
    ORIGINAL_EDITORS = clone(EDITORS);
    dirty = false;
    document.body.classList.remove('dirty');
    toast('Published. Everyone reading the rulebook is being updated now.', 'good');
  }catch(err){
    const code = (err && err.code) || 'upstream_error';
    BACKUPS.shift();               /* nothing was replaced, so drop the snapshot */
    AUDIT.shift();
    $('#publishBtn').disabled = false;
    if(code === 'conflict'){
      toast('Someone else published first — this page is reloading to their version. Your edits are kept for one restore.', 'bad');
    }else if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared'){
      setEditing(false);
      $('#editBtn').classList.add('hide');
      rememberReadOnly();
      toast('This view is read-only — only people the owner has given edit access can publish. Nothing you changed was saved or sent to anyone.', 'bad');
    }else if(code === 'too_large'){
      toast('The rulebook is too large to publish. Trim some rule text and try again.', 'bad');
    }else if(code === 'rate_limited'){
      toast('Publishing too often — wait a moment, then publish again.', 'bad');
    }else{
      toast('Publishing failed ('+code+'). Your edits are still here — try again in a moment.', 'bad');
    }
  }
}

let sheetHandler = null;
function openSheet(o){
  $('#sheetTitle').textContent = o.title;
  $('#sheetBody').textContent = o.body || '';
  $('#sheetBody').style.display = o.body ? '' : 'none';
  $('#sheetFields').innerHTML = o.fields || '';

  if(first) first.focus();
}

/* ---------------- backups ---------------- */

let dl = null;   /* the downloads capability, once it resolves */

function fmtWhen(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function stamp(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function validBook(b){
  return Array.isArray(b) && b.length > 0 && b.every(s =>
    s && typeof s.id === 'string' && typeof s.name === 'string' &&
    (Array.isArray(s.groups) || Array.isArray(s.changelog)));
}

function loadIntoEditor(book, where){
  BOOK.length = 0;
  clone(book).forEach(s=>BOOK.push(s));
  closeSheet();
  openRule = null;
  afterStructuralChange();
  toast(where + ' loaded. Read it over, then Publish to make it live for everyone.', 'good');
}

async function saveBackupFile(book, label, full){
  if(!dl){ toast('Saving a file is not available in this view.', 'bad'); return; }
  const payload = full
    ? {kind:'full-archive', savedAt:new Date().toISOString(),
       book:book, markers:MARKERS, editors:EDITORS, audit:AUDIT, backups:BACKUPS}
    : {kind:'rulebook', savedAt:new Date().toISOString(), book:book, markers:MARKERS};
  try{
    await dl.save({
      filename: 'mainstreet-rulebook-' + (full ? 'archive-' : '') + label + '.json',
      data: JSON.stringify(payload, null, 1)
    });
    if(full){ try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify({at:new Date().toISOString(), audit:AUDIT.length})); }catch(e){} }
    toast(full ? 'Full archive saved — keep it somewhere only you control.' : 'Backup file saved.', 'good');
    if(full && route.admin){ route.keepScroll = true; render(); }
  }catch(err){
    const c = (err && err.code) || 'unavailable';
    if(c === 'declined') return;
    toast(c === 'too_large' ? 'That backup is too large to save.' : 'The backup could not be saved ('+c+').', 'bad');
  }
}

/* ---------------- change detection for the audit log ---------------- */

function indexRules(book){
  const map = {};
  book.forEach(sec => (sec.groups||[]).forEach(g => g.rules.forEach(r => {
    map[r.id] = {r: r, page: g.name, section: sec.name};
  })));
  return map;
}

function diffBooks(before, after, markersBefore, markersAfter){
  const A = indexRules(before), B = indexRules(after), out = [];
  const q = s => '“' + s + '”';

  Object.keys(B).forEach(id => {
    if(!A[id]){ out.push('Added ' + id + ' ' + q(B[id].r.t) + ' to ' + B[id].page); return; }
    const a = A[id].r, b = B[id].r, bits = [];
    if(a.t !== b.t) bits.push('title, now ' + q(b.t));
    if(a.b !== b.b) bits.push('rule text');
    if((a.f||'') !== (b.f||'')){
      const name = x => x ? ((markersAfter.find(m=>m.id===x)||{}).label || x) : 'none';
      bits.push('marker ' + name(a.f) + ' → ' + name(b.f));
    }
    if(bits.length) out.push('Edited ' + id + ' ' + q(a.t) + ' — ' + bits.join(', '));
    if(A[id].page !== B[id].page) out.push('Moved ' + id + ' from ' + A[id].page + ' to ' + B[id].page);
  });

  Object.keys(A).forEach(id => {
    if(!B[id]) out.push('Removed ' + id + ' ' + q(A[id].r.t) + ' from ' + A[id].page);
  });

  /* pages and sections */
  const pagesOf = book => {
    const m = {};
    book.forEach(sec => (sec.groups||[]).forEach(g => m[sec.id+'/'+g.id] = {name:g.name, emoji:g.emoji, sec:sec.name}));
    return m;
  };
  const PA = pagesOf(before), PB = pagesOf(after);
  Object.keys(PB).forEach(k => {
    if(!PA[k]) out.push('Added the page ' + q(PB[k].name) + ' to ' + PB[k].sec);
    else{
      if(PA[k].name !== PB[k].name) out.push('Renamed the page ' + q(PA[k].name) + ' to ' + q(PB[k].name));
      if((PA[k].emoji||'') !== (PB[k].emoji||'')) out.push('Changed the emoji on ' + q(PB[k].name));
    }
  });
  Object.keys(PA).forEach(k => { if(!PB[k]) out.push('Deleted the page ' + q(PA[k].name)); });

  before.forEach(sa => {
    const sb = after.find(x => x.id === sa.id);
    if(!sb){ out.push('Removed the section ' + q(sa.name)); return; }
    if(sa.name !== sb.name) out.push('Renamed the section ' + q(sa.name) + ' to ' + q(sb.name));
    if(sa.blurb !== sb.blurb) out.push('Reworded the description of ' + q(sb.name));
  });
  after.forEach(sb => { if(!before.some(x => x.id === sb.id)) out.push('Added the section ' + q(sb.name)); });

  /* markers */
  (markersAfter||[]).forEach(mb => {
    const ma = (markersBefore||[]).find(x => x.id === mb.id);
    if(!ma){ out.push('Added the marker ' + q(mb.label)); return; }
    if(ma.label !== mb.label) out.push('Renamed the marker ' + q(ma.label) + ' to ' + q(mb.label));
    if((ma.emoji||'') !== (mb.emoji||'')) out.push('Changed the emoji on the marker ' + q(mb.label));
    if((ma.tone||'') !== (mb.tone||'')) out.push('Recoloured the marker ' + q(mb.label) + ' to ' + mb.tone);
  });
  (markersBefore||[]).forEach(ma => {
    if(!(markersAfter||[]).some(x => x.id === ma.id)) out.push('Deleted the marker ' + q(ma.label));
  });

  return out;
}

/* Roster changes are logged too, so tampering with who holds what is
   visible even to someone who worked around the interface. */
function diffEditors(before, after){
  const out = [], q = s => '“' + s + '”';
  const key = e => (e.name || '') + '|' + (e.addedAt || '');
  const A = {}, B = {};
  (before||[]).forEach(e => A[key(e)] = e);
  (after||[]).forEach(e => B[key(e)] = e);

  Object.keys(B).forEach(k => {
    const b = B[k], a = A[k];
    if(!a){ out.push('Added ' + q(b.name || 'someone') + ' to the roster as ' + (b.level||'editor')); return; }
    if((a.level||'editor') !== (b.level||'editor'))
      out.push('Changed ' + q(b.name) + ' from ' + (a.level||'editor') + ' to ' + (b.level||'editor'));
    if((a.sections||[]).join(',') !== (b.sections||[]).join(','))
      out.push('Changed which sections ' + q(b.name) + ' may edit');
    if(!!a.granted !== !!b.granted)
      out.push('Marked ' + q(b.name) + (b.granted ? ' as having edit access' : ' as no longer granted'));
    if(!!a.locked !== !!b.locked)
      out.push('⚠ ' + (b.locked ? 'Locked' : 'UNLOCKED') + ' the roster entry for ' + q(b.name));
  });
  Object.keys(A).forEach(k => {
    if(!B[k]) out.push((A[k].locked ? '⚠ Removed the LOCKED owner entry ' : 'Removed ') + q(A[k].name || 'someone') + ' from the roster');
  });
  return out;
}

/* ---------------- markers ---------------- */

const markerUse = id => {
  let n = 0;
  BOOK.forEach(s=>(s.groups||[]).forEach(g=>g.rules.forEach(r=>{ if(r.f===id) n++; })));
  return n;
};

function openMarkers(){
  const rows = MARKERS.map((m,i)=>
    '<div class="bk-row mk-row">'
    + '<input class="ed-input ed-emoji" data-mkemoji="'+i+'" value="'+esc(m.emoji||'')+'" maxlength="4" aria-label="Marker emoji">'
    + '<input class="ed-input" data-mklabel="'+i+'" value="'+esc(m.label)+'" aria-label="Marker name" style="flex:1;min-width:110px">'
    + '<div class="tones">' + TONES.map(t=>
        '<button class="tone-dot tone-'+t+((m.tone||'grey')===t?' on':'')+'" data-mktone="'+i+'" data-tone="'+t+'" title="'+t+'" aria-label="Colour: '+t+'"></button>').join('')
    + '</div>'
    + '<div class="bk-acts"><span class="mk-use">'+markerUse(m.id)+' rules</span>'
    + (isOwner() ? '<button class="icon-btn del" data-mkdel="'+i+'" title="Delete this marker">✕</button>'
                 : '<button class="icon-btn" disabled title="Only the owner can remove markers">✕</button>') + '</div></div>').join('');

  openSheet({
    title:'Markers',
    body:'These are the labels that sit beside a rule. Rename them, change the emoji or colour, or add your own — every rule using one updates with it.',
    fields:'<div class="bk-list">'+rows+'</div>'
      + '<div class="add-row" style="padding-top:14px"><button class="btn" id="mkAdd">+ Add a marker</button></div>',
    cancel:'Done'
  });
}

function openBackups(){
  const rows = BACKUPS.length
    ? BACKUPS.map((b,i)=>
        '<div class="bk-row"><div class="bk-meta"><div class="bk-when">'+esc(fmtWhen(b.at))+'</div>'
        + '<div class="bk-note">'+(b.note ? esc(b.note) : 'No note')+' · '+(b.rules==null?'?':b.rules)+' rules</div></div>'
        + '<div class="bk-acts">'
        + (dl ? '<button class="btn" data-bkfile="'+i+'">Save file</button>' : '')
        + '<button class="btn" data-bkload="'+i+'">Restore</button></div></div>').join('')
    : '<p class="hint" style="margin:0">No snapshots yet. One is kept automatically every time the rulebook is published.</p>';

  openSheet({
    title:'Backups',
    body:'The last '+MAX_BACKUPS+' published versions are kept inside this page. Restoring loads one into your editor — nothing changes for anyone else until you publish.',
    fields:
      '<div class="bk-list">'+rows+'</div>'
      + '<div class="bk-row" style="border-top:1px solid var(--line);margin-top:14px;padding-top:16px">'
      + '<div class="bk-meta"><div class="bk-when">This version</div>'
      + '<div class="bk-note">'+totalRules()+' rules'+(dirty?' · with your unpublished changes':'')+'</div></div>'
      + '<div class="bk-acts">'
      + (dl ? '<button class="btn" data-bkfile="now">Save file</button>' : '')
      + '<button class="btn" id="bkImport">Load a file…</button></div></div>',
    cancel:'Close'
  });
}

/* ---------------- events ---------------- */

document.addEventListener('click', e=>{
  const t = e.target;

  const goBtn = t.closest('[data-goto]');
  if(goBtn){ go(goBtn.dataset.goto, goBtn.dataset.rule, goBtn.dataset.group); return; }

  const copy = t.closest('[data-copy]');
  if(copy){
    const url = location.origin + location.pathname + location.search + '#' + copy.dataset.copy;
    const done = ()=>{ copy.classList.add('done'); setTimeout(()=>copy.classList.remove('done'),1400); };
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,done); else done();
    return;
  }

  const ack = t.closest('[data-ack]');
  if(ack){
    const id = ack.dataset.ack;
    readSet.has(id) ? readSet.delete(id) : readSet.add(id);
    saveRead();
    const on = readSet.has(id);
    ack.classList.toggle('on', on);
    ack.lastElementChild.textContent = on ? 'You have read this section' : 'Mark this section as read';
    renderNav(id);
    return;
  }

  if(t.closest('#sizeBtn')){ setTextSize(textSize % 3 + 1); return; }
  if(t.closest('#brandBtn')){ go(null); return; }
  if(t.closest('#burger')){ document.body.classList.add('nav-open'); return; }
  if(t.closest('#scrim')){ document.body.classList.remove('nav-open'); return; }

  if(t.closest('#editBtn')){ setEditing(!editing); return; }
  if(t.closest('#exitEdit')){ setEditing(false); return; }

  if(t.closest('#publishBtn')){
    if(!dirty){ toast('Nothing to publish yet — make a change first.'); return; }
    openSheet({
      title:'Publish to everyone',
      body:'This saves a new version of the rulebook. Every open view reloads to it, and the version it replaces is kept as a backup.',
      fields:'<div class="form" style="padding:0;border:0;background:none;margin:0">'
        + '<div><label for="pby">Your name (recorded in the audit log)</label>'
        + '<input id="pby" type="text" data-field="by" value="'+esc(editorName() || identity().name)+'" placeholder="e.g. your name"></div>'
        + '<div><label for="pn">What changed? (optional — adds a line to Rulebook Updates)</label>'
        + '<input id="pn" type="text" data-field="note" placeholder="e.g. Added the KOS duration rule"></div></div>',
      ok:'Publish',
      onOk: v => publishNow(v.note, v.by)
    });
    return;
  }

  if(t.closest('#backupsBtn')){ openBackups(); return; }

  const bkfile = t.closest('[data-bkfile]');
  if(bkfile){
    const which = bkfile.dataset.bkfile;
    if(which === 'now') saveBackupFile(BOOK, stamp());
    else{
      const b = BACKUPS[+which];
      if(b) saveBackupFile(b.book, (b.at||'').slice(0,10) || stamp());
    }
    return;
  }

  const bkload = t.closest('[data-bkload]');
  if(bkload){
    const b = BACKUPS[+bkload.dataset.bkload];
    if(b && confirm('Restore the version from ' + fmtWhen(b.at) + '?\n\nIt replaces what is on your screen right now. Nothing changes for anyone else until you publish.')){
      loadIntoEditor(b.book, 'Backup from ' + fmtWhen(b.at));
    }
    return;
  }

  if(t.closest('#bkImport')){ $('#importFile').click(); return; }

  if(t.closest('#adminBtn')){
    qInput.value = '';
    route = {sec:null, rule:null, group:null, admin:true};
    document.body.classList.remove('nav-open');
    try{ history.pushState(null,'','#admin'); }catch(e){}
    render();
    return;
  }

  if(t.closest('#markersBtn')){ openMarkers(); return; }
  if(t.closest('#backupsBtn2')){ openBackups(); return; }
  if(t.closest('#archiveBtn')){ saveBackupFile(BOOK, stamp(), true); return; }

  if(t.closest('#edAdd')){
    if(!isOwner()){ toast('Only the owner can change the roster.', 'bad'); return; }
    EDITORS.push({name:'', role:'', level:'editor', sections:[], granted:false, addedAt:new Date().toISOString()});
    markDirty();
    route.keepScroll = true; render();
    const inputs = $$('[data-edname]');
    if(inputs.length) inputs[inputs.length-1].focus();
    return;
  }

  const edLevel = t.closest('[data-edlevel]');
  if(edLevel){
    if(!isOwner()){ toast('Only the owner can change the roster.', 'bad'); return; }
    if(EDITORS[+edLevel.dataset.edlevel] && EDITORS[+edLevel.dataset.edlevel].locked){ toast('That entry is locked. It cannot be changed from inside the page.', 'bad'); return; }

    const e = EDITORS[+edLevel.dataset.edlevel];
    e.level = (e.level === 'owner') ? 'editor' : 'owner';
    markDirty(); route.keepScroll = true; render();
    return;
  }

  const edSec = t.closest('[data-edsec]');
  if(edSec){
    if(!isOwner()){ toast('Only the owner can change the roster.', 'bad'); return; }
    if(EDITORS[+edSec.dataset.edsec] && EDITORS[+edSec.dataset.edsec].locked){ toast('That entry is locked. It cannot be changed from inside the page.', 'bad'); return; }

    const e = EDITORS[+edSec.dataset.edsec];
    const sec = edSec.dataset.sec;
    let list = e.sections || [];
    if(sec === '*'){
      list = list.indexOf('*') > -1 ? [] : ['*'];
    }else{
      list = list.filter(x => x !== '*');
      list = list.indexOf(sec) > -1 ? list.filter(x => x !== sec) : list.concat([sec]);
    }
    e.sections = list;
    markDirty(); route.keepScroll = true; render();
    return;
  }

  const edGrant = t.closest('[data-edgrant]');
  if(edGrant){
    if(EDITORS[+edGrant.dataset.edgrant] && EDITORS[+edGrant.dataset.edgrant].locked){ toast('That entry is locked. It cannot be changed from inside the page.', 'bad'); return; }

    const e = EDITORS[+edGrant.dataset.edgrant];
    e.granted = !e.granted;
    markDirty();
    route.keepScroll = true; render();
    return;
  }

  const edDel = t.closest('[data-eddel]');
  if(edDel){
    if(!isOwner()){ toast('Only the owner can change the roster.', 'bad'); return; }
    if(EDITORS[+edDel.dataset.eddel] && EDITORS[+edDel.dataset.eddel].locked){ toast('That entry is locked. It cannot be changed from inside the page.', 'bad'); return; }

    const e = EDITORS[+edDel.dataset.eddel];
    if(confirm('Remove ' + (e.name || 'this person') + ' from the roster?\n\nThis only edits your record — it does not change anyone’s access. Remove that in the share menu.')){
      EDITORS.splice(+edDel.dataset.eddel,1);
      markDirty();
      route.keepScroll = true; render();
    }
    return;
  }

  if(t.closest('#mkAdd')){
    let base = 'mark', id = base, n = 1;
    while(markerById(id)){ id = base + (++n); }
    MARKERS.push({id:id, label:'New marker', emoji:'🔖', tone:'grey'});
    markDirty(); openMarkers(); render();
    return;
  }

  const mkTone = t.closest('[data-mktone]');
  if(mkTone){
    MARKERS[+mkTone.dataset.mktone].tone = mkTone.dataset.tone;
    markDirty(); openMarkers(); render();
    return;
  }

  const mkDel = t.closest('[data-mkdel]');
  if(mkDel){
    if(!isOwner()){ toast('Only the owner can remove markers.', 'bad'); return; }
    const m = MARKERS[+mkDel.dataset.mkdel];
    const used = markerUse(m.id);
    const msg = used
      ? 'Delete the “'+m.label+'” marker?\n\n'+used+' rule(s) use it. They keep their text and lose the marker.'
      : 'Delete the “'+m.label+'” marker?';
    if(confirm(msg)){
      BOOK.forEach(s=>(s.groups||[]).forEach(g=>g.rules.forEach(r=>{ if(r.f===m.id) delete r.f; })));
      MARKERS.splice(+mkDel.dataset.mkdel,1);
      markDirty(); openMarkers(); render();
    }
    return;
  }

  const setFlag = t.closest('[data-setflag]');
  if(setFlag){
    const art = setFlag.closest('[data-rule]');
    const f = art && findRule(art.dataset.rule);
    if(f){
      const id = setFlag.dataset.setflag;
      if(id) f.r.f = id; else delete f.r.f;
      markDirty(); render();
    }
    return;
  }

  if(!editing) return;

  /* ---- rule level ---- */
  const redit = t.closest('[data-redit]');
  if(redit){ openRule = (openRule===redit.dataset.redit) ? null : redit.dataset.redit; render(); return; }

  if(t.closest('[data-rclose]')){ openRule = null; INDEX = buildIndex(); render(); return; }

  const rmove = t.closest('[data-rmove]');
  if(rmove){
    const f = findRule(rmove.dataset.rmove);
    if(f){
      const j = f.i + Number(rmove.dataset.dir);
      if(j>=0 && j<f.g.rules.length){
        f.g.rules.splice(f.i,1);
        f.g.rules.splice(j,0,f.r);
        afterStructuralChange();
      }
    }
    return;
  }

  const rdel = t.closest('[data-rdel]');
  if(rdel){
    if(!isOwner()){ toast('Only the owner can remove rules. You can edit and add.', 'bad'); return; }
    const f = findRule(rdel.dataset.rdel);
    if(f && confirm('Delete rule ' + f.r.id + ' — “' + f.r.t + '”?\n\nAny link or report citing this ID will stop resolving.')){
      f.g.rules.splice(f.i,1);
      openRule = null;
      afterStructuralChange();
    }
    return;
  }

  const gadd = t.closest('[data-gadd]');
  if(gadd){
    const sec = currentSection();
    const g = sec.groups.find(x=>x.id===gadd.dataset.gadd);
    const r = {id: nextId(g.prefix), t:'New rule', b:'<p></p>'};
    g.rules.push(r);
    openRule = r.id;
    afterStructuralChange();
    const el = document.getElementById(sec.id+'/'+r.id);
    if(el){ el.scrollIntoView({block:'center'}); const i = el.querySelector('[data-bind="t"]'); if(i){ i.focus(); i.select(); } }
    return;
  }

  /* ---- page (group) level ---- */
  const gmove = t.closest('[data-gmove]');
  if(gmove){
    const sec = currentSection();
    const i = sec.groups.findIndex(x=>x.id===gmove.dataset.gmove);
    const j = i + Number(gmove.dataset.dir);
    if(i>-1 && j>=0 && j<sec.groups.length){
      const [g] = sec.groups.splice(i,1);
      sec.groups.splice(j,0,g);
      afterStructuralChange();
    }
    return;
  }

  const gdel = t.closest('[data-gdel]');
  if(gdel){
    if(!isOwner()){ toast('Only the owner can remove pages. You can edit and add.', 'bad'); return; }
    const sec = currentSection();
    const i = sec.groups.findIndex(x=>x.id===gdel.dataset.gdel);
    if(i>-1){
      const g = sec.groups[i];
      if(confirm('Delete the page “'+g.name+'” and its '+g.rules.length+' rule(s)?')){
        sec.groups.splice(i,1);
        afterStructuralChange();
      }
    }
    return;
  }

  if(t.closest('#pageAdd')){
    openSheet({
      title:'Add a page',
      body:'A page is one group of rules inside this section.',
      fields:'<div class="form" style="padding:0;border:0;background:none;margin:0">'
      + '<div><label for="np">Page name</label><input id="np" type="text" data-field="name" placeholder="e.g. Heists &amp; Robbery Crews"></div>'
      + '<div><label for="nx">Rule ID prefix</label><input id="nx" type="text" data-field="prefix" placeholder="e.g. HST" maxlength="6"></div></div>',
      ok:'Add page',
      onOk: v=>{
        if(!v.name) return;
        const sec = currentSection();
        const prefix = (v.prefix || v.name.replace(/[^a-z]/gi,'').slice(0,3)).toUpperCase();
        let id = v.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'page';
        while(sec.groups.some(g=>g.id===id)) id += '-2';
        sec.groups.push({id, name:v.name, prefix, rules:[]});
        afterStructuralChange();
        const el = document.getElementById('g-'+sec.id+'-'+id);
        if(el) el.scrollIntoView({block:'center'});
      }
    });
    return;
  }

  /* ---- changelog ---- */
  if(t.closest('#logAdd')){
    const log = logSection();
    const d = new Date();
    log.changelog.unshift({
      date: String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear(),
      title:'Rulebook updated', adds:['']
    });
    afterStructuralChange();
    return;
  }

  const ldel = t.closest('[data-ldel]');
  if(ldel){
    const log = logSection();
    if(confirm('Delete this changelog entry?')){
      log.changelog.splice(Number(ldel.dataset.ldel),1);
      afterStructuralChange();
    }
    return;
  }
});

/* live binding — never re-renders, so typing keeps focus */
document.addEventListener('input', e=>{
  const el = e.target;

  /* admin panel — usable without turning on edit mode */
  if(el.id === 'auditFind'){ auditFilter = el.value; route.keepScroll = true; render(); $('#auditFind').focus(); return; }
  if(el.dataset.edname !== undefined){ const e=EDITORS[+el.dataset.edname]; if(isOwner() && !e.locked){ e.name = el.value; markDirty(); } return; }
  if(el.dataset.edrole !== undefined){ const e=EDITORS[+el.dataset.edrole]; if(isOwner() && !e.locked){ e.role = el.value; markDirty(); } return; }

  if(!editing) return;

  const bind = el.dataset.bind;
  if(bind){
    const art = el.closest('[data-rule]');
    const f = art && findRule(art.dataset.rule);
    if(f){
      if(bind === 'b') f.r.b = normalizeBody(el.value);
      else if(bind === 'f'){ if(el.value) f.r.f = el.value; else delete f.r.f; }
      else f.r.t = el.value;
      markDirty();
    }
    return;
  }

  if(el.dataset.mklabel !== undefined){
    MARKERS[+el.dataset.mklabel].label = el.value; markDirty(); render(); return;
  }
  if(el.dataset.mkemoji !== undefined){
    MARKERS[+el.dataset.mkemoji].emoji = el.value.trim(); markDirty(); render(); return;
  }

  if(el.dataset.gname !== undefined){
    const sec = currentSection();
    const g = sec.groups.find(x=>x.id===el.dataset.gname);
    if(g){ g.name = el.value; markDirty(); renderNav(sec.id); }
    return;
  }

  if(el.dataset.gemoji !== undefined){
    const sec = currentSection();
    const g = sec.groups.find(x=>x.id===el.dataset.gemoji);
    if(g){ g.emoji = el.value.trim(); markDirty(); renderNav(sec.id); }
    return;
  }

  if(el.hasAttribute('data-semoji')){
    currentSection().emoji = el.value.trim(); markDirty(); renderNav(route.sec); return;
  }

  if(el.hasAttribute('data-sname')){ currentSection().name = el.value; markDirty(); renderNav(route.sec); return; }
  if(el.hasAttribute('data-sblurb')){ currentSection().blurb = el.value; markDirty(); return; }

  const log = logSection();
  if(el.dataset.ldate !== undefined){ log.changelog[+el.dataset.ldate].date = el.value; markDirty(); return; }
  if(el.dataset.ltitle !== undefined){ log.changelog[+el.dataset.ltitle].title = el.value; markDirty(); return; }
  if(el.dataset.litems !== undefined){
    log.changelog[+el.dataset.litems].adds = el.value.split('\n').filter(x=>x.trim());
    markDirty(); return;
  }
  if(el.dataset.lwas !== undefined){ log.changelog[+el.dataset.lwas].changes[+el.dataset.ci].was = el.value; markDirty(); return; }
  if(el.dataset.lnow !== undefined){ log.changelog[+el.dataset.lnow].changes[+el.dataset.ci].now = el.value; markDirty(); return; }
});

$('#importFile').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let book = null;
    try{
      const parsed = JSON.parse(reader.result);
      book = Array.isArray(parsed) ? parsed : (parsed && parsed.book);
    }catch(err){ book = null; }
    if(!validBook(book)){ toast('That file is not a rulebook backup.', 'bad'); return; }
    if(confirm('Load “'+file.name+'” into the editor?\n\nIt replaces what is on your screen right now. Nothing changes for anyone else until you publish.')){
      const parsedAgain = (function(){ try{ return JSON.parse(reader.result); }catch(e){ return null; } })();
      if(parsedAgain && Array.isArray(parsedAgain.markers) && parsedAgain.markers.length){
        MARKERS = clone(parsedAgain.markers);
      }
      loadIntoEditor(book, file.name);
    }
  };
  reader.onerror = ()=>toast('That file could not be read.', 'bad');
  reader.readAsText(file);
});

document.addEventListener('change', e=>{
  if(e.target.id === 'whoAmI'){
    setIdentity(e.target.value);
    const me = identity();
    openRule = null;
    render();
    toast(me.level === 'owner'
      ? 'Editing as the owner — full rights.'
      : 'Editing as ' + me.name + ' — you can edit and add, but not remove.');
  }
});

let searchTimer;
qInput.addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(render,130); });

document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==qInput && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); qInput.focus(); qInput.select();
  }
  if(e.key==='Escape'){
    if($('#sheet').classList.contains('show')) closeSheet();
    else if(document.body.classList.contains('nav-open')) document.body.classList.remove('nav-open');
    else if(qInput.value){ qInput.value=''; render(); qInput.blur(); }
  }
});

window.addEventListener('popstate', ()=>{ qInput.value=''; readUrl(); render(); });

window.addEventListener('beforeunload', e=>{
  if(dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* ---------------- boot ---------------- */

try{ setTextSize(Number(localStorage.getItem(SIZE_KEY)) || 1, true); }catch(e){}

refreshStats();
readUrl();
render();
syncBarHeight();

/* unsaved edits from a session that ended in a conflict or a closed tab */
try{
  const draft = sessionStorage.getItem(DRAFT);
  if(draft && draft !== JSON.stringify(BOOK)){
    $('#restoreBar').classList.add('show');
    $('#restoreYes').addEventListener('click', ()=>{
      try{
        const d = JSON.parse(draft);
        BOOK.length = 0; d.forEach(s=>BOOK.push(s));
        $('#restoreBar').classList.remove('show');
        INDEX = buildIndex(); refreshStats(); markDirty();
        setEditing(true);
        toast('Your unpublished edits are back. Publish them when you are ready.', 'good');
      }catch(err){ toast('Those edits could not be restored.', 'bad'); }
    });
    $('#restoreNo').addEventListener('click', ()=>{
      try{ sessionStorage.removeItem(DRAFT); }catch(err){}
      $('#restoreBar').classList.remove('show');
    });
  }
}catch(e){}

/* The edit button appears once the runtime hands us the capability — and not
   at all for a viewer whose publish was already refused this week. */
if(window.claude && typeof window.claude.use === 'function' && !wasRefusedRecently()){
  window.claude.use('artifact').then(a=>{
    if(a){ cap = a; $('#editBtn').classList.remove('hide'); $('#adminBtn').classList.remove('hide'); }
  }).catch(()=>{});
  window.claude.use('downloads').then(d=>{ dl = d; }).catch(()=>{});
}
</script>
